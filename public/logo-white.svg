<svg 
  viewBox="0 0 280 64" 
  width="280" 
  height="64" 
  fill="none" 
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="tealGradStaticWhite" x1="40" y1="4" x2="64" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06b6d4" />
      <stop offset="100%" stopColor="#0d9488" />
    </linearGradient>
    <linearGradient id="roseGradStaticWhite" x1="88" y1="4" x2="64" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#f43f5e" />
      <stop offset="100%" stopColor="#e11d48" />
    </linearGradient>
    <linearGradient id="greenGradStaticWhite" x1="54" y1="13" x2="74" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4ade80" />
      <stop offset="100%" stopColor="#16a34a" />
    </linearGradient>
    <linearGradient id="boneGradStaticWhite" x1="62" y1="6" x2="67" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#f8fafc" />
      <stop offset="100%" stopColor="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Wrapping Group for Icon to translate it to x=32 (centered vertical range 0-64) -->
  <g transform="translate(8, 0)">
    <!-- Left hand/heart curve (Teal) -->
    <path 
      d="M 32,54 C 18,46 8,34 8,22 C 8,11 16,4 26,4 C 29,4 31,5.5 32,7 C 30.5,9.5 29.5,13 29.5,18 C 29.5,29 31.5,38 32,46 Z" 
      fill="url(#tealGradStaticWhite)"
    />

    <!-- Right hand/heart curve (Rose) -->
    <path 
      d="M 32,54 C 46,46 56,34 56,22 C 56,11 48,4 38,4 C 35,4 33,5.5 32,7 C 33.5,9.5 34.5,13 34.5,18 C 34.5,29 32.5,38 32,46 Z" 
      fill="url(#roseGradStaticWhite)"
    />

    <!-- Center Bone (White/Silver outline) -->
    <path 
      d="M 30,14 C 28,14 27,12 27,10 C 27,8 29,6 31,6 C 32,6 32.5,7 33,7.5 C 33.5,7 34,6 35,6 C 37,6 39,8 39,10 C 39,12 38,14 36,14 L 35,14 L 35,46 L 36,46 C 38,46 39,48 39,50 C 39,52 37,54 35,54 C 34,54 33.5,53 33,52.5 C 32.5,53 32,54 31,54 C 29,54 27,52 27,50 C 27,48 28,46 30,46 Z" 
      fill="url(#boneGradStaticWhite)"
      stroke="#cbd5e1"
      strokeWidth="1"
    />

    <!-- Leaves / Sprouts (Green) -->
    <path 
      d="M 31,26 C 26,26 22,22 22,17 C 26,17 30,21 31,26 Z" 
      fill="url(#greenGradStaticWhite)"
    />
    <path 
      d="M 33,22 C 38,22 42,18 42,13 C 38,13 34,17 33,22 Z" 
      fill="url(#greenGradStaticWhite)"
    />
    <path 
      d="M 32,30 C 32,27 32,24 33,22" 
      stroke="#16a34a" 
      strokeWidth="1.5" 
      strokeLinecap="round"
    />
  </g>

  <!-- Typography (Light/White text for dark backgrounds) -->
  <text x="84" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="20" fill="#ffffff" letter-spacing="-0.02em">
    BoneMarrow<tspan fill="#f43f5e">Donation</tspan>
  </text>
  <text x="84" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="9" fill="#94a3b8" letter-spacing="0.16em">
    CONNECT • DONATE • SAVE LIVES
  </text>
</svg>
